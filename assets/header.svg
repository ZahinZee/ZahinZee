<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Israt Zahin — ML researcher and full-stack engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <clipPath id="xray">
      <rect x="720" y="124" width="68" height="68" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .edge { stroke: #263248; stroke-width: 1; fill: none; }
    .flow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 4 16; animation: flow 1.6s linear infinite; }
    .flow.c { stroke: #22d3ee; }
    .flow.v { stroke: #a78bfa; animation-duration: 2s; }
    .px { fill: #e2e8f0; animation: px 3.2s ease-in-out infinite; }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 2.6s ease-in-out infinite alternate; }
    .out { opacity: 0.3; animation: pick 8s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes px { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.7; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(66px); } }
    @keyframes pick { 0%, 30%, 100% { opacity: 0.3; } 5%, 25% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .out { opacity: 1; } }
  </style>

  <!-- card -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <ellipse cx="930" cy="160" rx="260" ry="150" fill="url(#glow)"/>

  <!-- intro -->
  <text x="64" y="104" class="mono" font-size="18" fill="#22d3ee">hello, I'm</text>
  <text x="62" y="166" class="sans" font-size="64" font-weight="700" fill="#f8fafc">Israt Zahin</text>
  <rect x="64" y="184" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="224" class="sans" font-size="20" fill="#cbd5e1"><tspan fill="#22d3ee" font-weight="600">ML Researcher</tspan> — deep learning for medical imaging</text>
  <text x="64" y="256" class="sans" font-size="20" fill="#cbd5e1"><tspan fill="#a78bfa" font-weight="600">Full-Stack Engineer</tspan> — FastAPI · PostgreSQL · Next.js · AWS</text>
  <text x="64" y="290" class="mono" font-size="14" fill="#64748b">Dhaka, Bangladesh</text>

  <!-- edges: input -> CNN -> LSTM -> classes -->
  <g class="edge">
    <path d="M790 158 L850 113"/><path d="M790 158 L850 158"/><path d="M790 158 L850 203"/>
    <path d="M850 113 L950 113"/><path d="M850 113 L950 158"/><path d="M850 113 L950 203"/>
    <path d="M850 158 L950 113"/><path d="M850 158 L950 158"/><path d="M850 158 L950 203"/>
    <path d="M850 203 L950 113"/><path d="M850 203 L950 158"/><path d="M850 203 L950 203"/>
    <path d="M950 113 L1060 113"/><path d="M950 113 L1060 143"/><path d="M950 113 L1060 173"/><path d="M950 113 L1060 203"/>
    <path d="M950 158 L1060 113"/><path d="M950 158 L1060 143"/><path d="M950 158 L1060 173"/><path d="M950 158 L1060 203"/>
    <path d="M950 203 L1060 113"/><path d="M950 203 L1060 143"/><path d="M950 203 L1060 173"/><path d="M950 203 L1060 203"/>
  </g>
  <g class="flow c">
    <path d="M790 158 L850 113"/><path d="M790 158 L850 158"/><path d="M790 158 L850 203"/>
    <path d="M850 113 L950 113"/><path d="M850 113 L950 158"/><path d="M850 113 L950 203"/>
    <path d="M850 158 L950 113"/><path d="M850 158 L950 158"/><path d="M850 158 L950 203"/>
    <path d="M850 203 L950 113"/><path d="M850 203 L950 158"/><path d="M850 203 L950 203"/>
  </g>
  <g class="flow v">
    <path d="M950 113 L1060 113"/><path d="M950 113 L1060 143"/><path d="M950 113 L1060 173"/><path d="M950 113 L1060 203"/>
    <path d="M950 158 L1060 113"/><path d="M950 158 L1060 143"/><path d="M950 158 L1060 173"/><path d="M950 158 L1060 203"/>
    <path d="M950 203 L1060 113"/><path d="M950 203 L1060 143"/><path d="M950 203 L1060 173"/><path d="M950 203 L1060 203"/>
  </g>

  <!-- input: chest X-ray as image patches, with a scan line -->
  <g>
    <rect x="720" y="124" width="14" height="14" rx="2" class="px" style="animation-delay:0s"/>
    <rect x="738" y="124" width="14" height="14" rx="2" class="px" style="animation-delay:-0.8s"/>
    <rect x="756" y="124" width="14" height="14" rx="2" class="px" style="animation-delay:-1.9s"/>
    <rect x="774" y="124" width="14" height="14" rx="2" class="px" style="animation-delay:-0.4s"/>
    <rect x="720" y="142" width="14" height="14" rx="2" class="px" style="animation-delay:-2.4s"/>
    <rect x="738" y="142" width="14" height="14" rx="2" class="px" style="animation-delay:-1.2s"/>
    <rect x="756" y="142" width="14" height="14" rx="2" class="px" style="animation-delay:-2.9s"/>
    <rect x="774" y="142" width="14" height="14" rx="2" class="px" style="animation-delay:-1.6s"/>
    <rect x="720" y="160" width="14" height="14" rx="2" class="px" style="animation-delay:-0.6s"/>
    <rect x="738" y="160" width="14" height="14" rx="2" class="px" style="animation-delay:-2.1s"/>
    <rect x="756" y="160" width="14" height="14" rx="2" class="px" style="animation-delay:-1s"/>
    <rect x="774" y="160" width="14" height="14" rx="2" class="px" style="animation-delay:-2.6s"/>
    <rect x="720" y="178" width="14" height="14" rx="2" class="px" style="animation-delay:-1.4s"/>
    <rect x="738" y="178" width="14" height="14" rx="2" class="px" style="animation-delay:-0.2s"/>
    <rect x="756" y="178" width="14" height="14" rx="2" class="px" style="animation-delay:-2.2s"/>
    <rect x="774" y="178" width="14" height="14" rx="2" class="px" style="animation-delay:-3s"/>
    <g clip-path="url(#xray)">
      <rect x="716" y="124" width="76" height="2" fill="#22d3ee" class="scan"/>
    </g>
  </g>

  <!-- CNN layer -->
  <g fill="#22d3ee">
    <circle cx="850" cy="113" r="7" class="node" style="animation-delay:0s"/>
    <circle cx="850" cy="158" r="7" class="node" style="animation-delay:-0.8s"/>
    <circle cx="850" cy="203" r="7" class="node" style="animation-delay:-1.6s"/>
  </g>

  <!-- LSTM layer, with recurrent loops -->
  <g fill="none" stroke="#a78bfa" stroke-width="1.4" opacity="0.7">
    <path d="M944 107 a9 9 0 1 1 12 0"/>
    <path d="M944 152 a9 9 0 1 1 12 0"/>
    <path d="M944 197 a9 9 0 1 1 12 0"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="950" cy="113" r="7" class="node" style="animation-delay:-0.4s"/>
    <circle cx="950" cy="158" r="7" class="node" style="animation-delay:-1.2s"/>
    <circle cx="950" cy="203" r="7" class="node" style="animation-delay:-2s"/>
  </g>

  <!-- output classes, highlighted in turn -->
  <g class="mono" font-size="13" fill="#e2e8f0">
    <g class="out" style="animation-delay:0s"><circle cx="1060" cy="113" r="6" fill="#f8fafc"/><text x="1074" y="117">COVID-19</text></g>
    <g class="out" style="animation-delay:2s"><circle cx="1060" cy="143" r="6" fill="#f8fafc"/><text x="1074" y="147">Opacity</text></g>
    <g class="out" style="animation-delay:4s"><circle cx="1060" cy="173" r="6" fill="#f8fafc"/><text x="1074" y="177">Pneumonia</text></g>
    <g class="out" style="animation-delay:6s"><circle cx="1060" cy="203" r="6" fill="#f8fafc"/><text x="1074" y="207">Normal</text></g>
  </g>

  <!-- layer labels -->
  <g class="mono" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="754" y="240">chest X-ray</text>
    <text x="850" y="240">CNN</text>
    <text x="950" y="240">LSTM</text>
    <text x="1100" y="240">class</text>
  </g>
</svg>
